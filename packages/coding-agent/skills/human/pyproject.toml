# Kernel-side package for the bundled human skill. It only talks to the host
# through rlm.host_request; prime-agent-runtime is always installed in the
# kernel venv before skills, so it is intentionally not declared as a
# dependency (it is not published on PyPI).
[project]
name = "human"
version = "0.1.0"
description = "Prime Agent human skill: ask the operator for codes, identity checks and decisions"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/human"]
