# Builds the RunPod image (deploy/Dockerfile) on a native amd64 runner and pushes it to GHCR.
# Replaces local `docker buildx --platform linux/amd64` builds: under emulation on an arm64 Mac
# they take 30+ min and fail on any slow download (apt, canvas prebuilds).
#
#   gh workflow run pod-image.yml -f tag=0.1.3
name: pod-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (also pushed as latest)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/erikcik/prime-agent-pod:${{ inputs.tag }}
            ghcr.io/erikcik/prime-agent-pod:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
